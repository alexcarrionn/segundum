<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
	<h:head>
		<meta charset="utf-8" />		
		<title>SegundUM App - <ui:insert name="title" /></title>
		<h:outputStylesheet name="assets/css/main.css" />	
	</h:head>
	<h:body class="homepage is-preload">
        
        <ui:insert name="metadata" />
        
		<div id="page-wrapper">
			<section id="header">
			<h1>
				<a href="#{request.contextPath}/index.xhtml">SEGUNDUM</a>
			</h1>
			
			<nav id="nav">
			<ul>
                <li class="#{estilo1}"><a
					href="#{request.contextPath}/index.xhtml">Inicio</a>
                </li>
                
                <li class="#{estilo2}"><a
					href="#{request.contextPath}/buscar.xhtml">Buscar Productos</a>
                </li>

                <ui:fragment rendered="#{not empty controlAccesoBean.usuarioLogueado}">
                    
                    <li class="#{estilo3}"><a
                        href="#{request.contextPath}/producto/crearProducto.xhtml">Vender Producto</a>
                    </li>
                    
                    <li class="#{estilo4}"><a
                        href="#{request.contextPath}/producto/misProductos.xhtml">Mis Productos</a>
                    </li>
                    
                    <li class="logout-item">
						<h:form id="logoutForm" style="display: inline;">
                            <h:commandButton value="Cerrar Sesión (#{controlAccesoBean.usuarioLogueado.nombre})" 
                                             action="#{controlAccesoBean.logout}" 
                                             styleClass="button" />
						</h:form>
					</li>
                </ui:fragment>
                
                <ui:fragment rendered="#{empty controlAccesoBean.usuarioLogueado}">
                    <li class="#{estilo_login}"><a class="button" role="button"
						href="#{request.contextPath}/login.xhtml">Iniciar Sesión</a>
                    </li>
                </ui:fragment>

			</ul>
			</nav> 
            </section>
			<section id="main">
			<div class="container">
				<ui:insert name="content" />
			</div>
			</section>
			<ui:include src="/WEB-INF/template/footer.xhtml" />
		</div>

		<h:outputScript library="primefaces" name="jquery/jquery.js" />
		<h:outputScript name="assets/js/jquery.dropotron.min.js" />
		<h:outputScript name="assets/js/browser.min.js" />
		<h:outputScript name="assets/js/breakpoints.min.js" />
		<h:outputScript name="assets/js/util.js" />
		<h:outputScript name="assets/js/main.js" />
	</h:body>
</html>
