<ui:composition template="/WEB-INF/template/template_inicio.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Mis Productos a la Venta
    </ui:define>

    <ui:define name="content">
        
        <p:panel header="Gestión de mis productos">
            
            <p:messages id="messages" showDetail="true" closable="true">
                <p:autoUpdate />
            </p:messages>

            <h:form id="formMisProductos">
				
				<p:toolbar style="margin-bottom: 1rem;">
				                    <p:toolbarGroup>
				                        <p:button value="Volver al Inicio" icon="pi pi-home" 
				                                  outcome="/index" styleClass="ui-button-secondary"/>
				                    </p:toolbarGroup>
				                    
				                    <p:toolbarGroup align="right">
				                        <p:button value="Vender nuevo producto" icon="pi pi-plus" 
				                                  outcome="/producto/alta" />
				                    </p:toolbarGroup>
				                </p:toolbar>
                
                <p:dataTable id="tablaProductos"
                             var="p" 
                             value="#{misProductosBean.misProductos}"
                             paginator="true" rows="10"
                             emptyMessage="No tienes ningún producto a la venta.">

                    <p:column headerText="Título" sortBy="#{p.titulo}" filterBy="#{p.titulo}" filterMatchMode="contains">
                        <h:outputText value="#{p.titulo}" />
                    </p:column>

                    <p:column headerText="Precio" sortBy="#{p.precio}">
                        <h:outputText value="#{p.precio}">
                            <f:convertNumber type="currency" currencySymbol="€" locale="es_ES" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Estado" sortBy="#{p.estado}">
                        <h:outputText value="#{p.estado}" />
                    </p:column>

					<p:column headerText="Publicado" sortBy="#{p.fechaPublicacion}">
					    <h:outputText value="#{p.fechaPublicacion}">
					        <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" />
					    </h:outputText>
					</p:column>

                    <p:column headerText="Categoría" sortBy="#{p.nombreCategoria}">
                        <h:outputText value="#{p.nombreCategoria}" />
                    </p:column>

                    <p:column headerText="Vistas" sortBy="#{p.visualizaciones}">
                        <h:outputText value="#{p.visualizaciones}" />
                    </p:column>
                    
					<p:column headerText="Acciones" style="width:100px; text-align: center">
					    <p:button icon="pi pi-pencil" title="Editar"
					              outcome="/producto/gestionar" >
					        <f:param name="id" value="#{p.id}" />
					        <f:param name="origen" value="misproductos" />
					    </p:button>
					</p:column>

                </p:dataTable>
            </h:form>
            
        </p:panel>
        
    </ui:define>
</ui:composition>
