<ui:composition template="/WEB-INF/template/template_inicio.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Crear Nuevo Producto
    </ui:define>

    <ui:define name="content">
    
        <h:form id="formCrear">
            <p:panel header="Poner un producto a la venta">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" 
                             columnClasses="ui-g-12 ui-md-3, ui-g-12 ui-md-9">
                    
                    <p:outputLabel for="titulo" value="Título:" />
                    <p:inputText id="titulo" value="#{crearProductoBean.titulo}" required="true" 
                                 requiredMessage="El título es obligatorio." style="width:100%"/>

                    <p:outputLabel for="desc" value="Descripción:" />
                    <p:inputTextarea id="desc" value="#{crearProductoBean.descripcion}" rows="6" 
                                     style="width:100%"/>

                    <p:outputLabel for="precio" value="Precio (€):" />
                    <p:inputNumber id="precio" value="#{crearProductoBean.precio}" required="true" 
                                   requiredMessage="El precio es obligatorio." minValue="0" 
                                   decimalSeparator="," thousandSeparator="." />

                    <p:outputLabel for="estado" value="Estado:" />
                    <p:selectOneMenu id="estado" value="#{crearProductoBean.estado}" required="true"
                                     requiredMessage="Debes seleccionar un estado.">
                        <f:selectItem itemLabel="Selecciona un estado..." itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{crearProductoBean.estadosDisponibles}" var="e"
                                       itemLabel="#{e}" itemValue="#{e}" /> 
                    </p:selectOneMenu>

                    <p:outputLabel for="categoria" value="Categoría:" />
                    <p:selectOneMenu id="categoria" value="#{crearProductoBean.idCategoria}" required="true"
                                     requiredMessage="Debes seleccionar una categoría.">
                        <f:selectItem itemLabel="Selecciona una categoría..." itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{crearProductoBean.categoriasDisponibles}" var="c"
                                       itemLabel="#{c.nombre}" itemValue="#{c.id}" /> 
                    </p:selectOneMenu>

                    <p:outputLabel for="envio" value="Envío disponible:" />
                    <p:selectBooleanCheckbox id="envio" value="#{crearProductoBean.envioDisponible}" />

                </p:panelGrid>

				<p:toolbar>
				                     <p:toolbarGroup>
				                        <p:commandButton value="Crear Producto" 
				                                         icon="pi pi-check-circle"
				                                         actionListener="#{crearProductoBean.crearProducto}"
				                                         update="formCrear growl panelDialogo" 
				                                         oncomplete="if (!args.validationFailed) PF('dialogResultado').show()" />
				                    </p:toolbarGroup>

									<p:toolbarGroup align="right">
									        <p:button value="Cancelar" icon="pi pi-times"
									                  outcome="/index" 
									                  styleClass="ui-button-danger" 
									                  style="margin-right: .5rem"/>
									</p:toolbarGroup>
				 </p:toolbar>
            </p:panel>
            
            <p:growl id="growl" showDetail="true" />

        </h:form>

        <p:dialog header="Resultado de la operación" widgetVar="dialogResultado" modal="true" 
                  closable="false" responsive="true">
                  
            <p:outputPanel id="panelDialogo" style="text-align:center;">
                
                <p:staticMessage rendered="#{crearProductoBean.errorAlCrear}"
                    severity="error" detail="El producto NO se ha podido crear." style="width: 90%" />

                <p:staticMessage rendered="#{!crearProductoBean.errorAlCrear}"
                    severity="info" detail="¡Producto creado correctamente!" style="width: 90%" />

                <br/><br/>
                
                <p:commandButton value="Cerrar" rendered="#{crearProductoBean.errorAlCrear}"
                                 onclick="PF('dialogResultado').hide()" type="button" 
                                 style="margin-top:5px" />

				<p:linkButton value="Ver mis productos" rendered="#{!crearProductoBean.errorAlCrear}"
							  outcome="/usuario/mis-productos" style="margin-top:5px; margin-right: 5px;"/>
                              
                <p:commandButton value="Crear otro producto" rendered="#{!crearProductoBean.errorAlCrear}"
                                 onclick="PF('dialogResultado').hide()" type="button" 
                                 style="margin-top:5px" />

            </p:outputPanel>
        </p:dialog>

    </ui:define>
</ui:composition>
