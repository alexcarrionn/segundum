<ui:composition template="/WEB-INF/template/template_inicio.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Editar Producto
    </ui:define>

    <f:metadata>
        <f:viewParam name="id" value="#{editarProductoBean.idProducto}" required="true"
                     requiredMessage="Se necesita un ID de producto para editar."/>
        <f:viewAction action="#{editarProductoBean.load()}" />
    </f:metadata>


    <ui:define name="content">
    
        <p:panel header="Editar producto: #{editarProductoBean.producto.titulo}" 
                 rendered="#{editarProductoBean.producto ne null}">
            
            <h:form id="formEditar">
                <p:messages id="messages" showDetail="true" closable="true">
                    <p:autoUpdate />
                </p:messages>
                <p:growl id="growl" showDetail="true" />
            
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                             columnClasses="ui-g-12 ui-md-3, ui-g-12 ui-md-9">

                    <p:outputLabel value="Título:" />
                    <h:outputText value="#{editarProductoBean.producto.titulo}" style="font-weight:bold;" />

                    <p:outputLabel for="precio" value="Precio (€):" />
                    <p:inputNumber id="precio" value="#{editarProductoBean.nuevoPrecio}" required="true" 
                                   requiredMessage="El precio es obligatorio." minValue="0"
                                   decimalSeparator="," thousandSeparator="." />

                    <p:outputLabel for="desc" value="Descripción:" />
                    <p:inputTextarea id="desc" value="#{editarProductoBean.nuevaDescripcion}" rows="8" 
                                     style="width:100%"/>
                
                </p:panelGrid>
                
                <p:toolbar>
                     <p:toolbarGroup>
                        <p:commandButton value="Guardar Cambios" 
                                         icon="pi pi-save"
                                         action="#{editarProductoBean.guardarCambios()}"
                                         update="@form" />
                    </p:toolbarGroup>
                    <p:toolbarGroup align="right">
						<p:button value="Cancelar" icon="pi pi-times"
						          outcome="/usuario/mis-productos" styleClass="ui-button-secondary"/>
                    </p:toolbarGroup>
                </p:toolbar>
                
            </h:form>
            
        </p:panel>
        
        <p:panel header="Cargando..." rendered="#{editarProductoBean.producto eq null}">
            <h:outputText value="Cargando datos del producto..." />
        </p:panel>
        
    </ui:define>
</ui:composition>
